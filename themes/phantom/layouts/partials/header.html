<header id="header">
  <div class="inner">
    <a href="{{ "/" | relURL }}" class="logo">
      <span class="symbol" aria-hidden="true">◆</span><span class="title">{{ site.Title }}</span>
    </a>
    <nav class="header-nav">
      <button type="button" id="theme-toggle" class="icon-btn" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <a href="{{ "search/" | relURL }}" class="icon-btn" aria-label="Search" title="Search">&#9906;</a>
      <button type="button" id="menu-open" class="menu-link" aria-controls="menu" aria-expanded="false">Menu</button>
    </nav>
  </div>
</header>
