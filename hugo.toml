baseURL = "https://cyix1.github.io/"
languageCode = "en-us"
title = "Yixis Playground"
theme = "phantom"

enableRobotsTXT = true
enableEmoji = true
pagerSize = 10

[markup.goldmark.renderer]
  unsafe = true            # allow raw HTML inside Markdown

[markup.highlight]
  noClasses = false

[outputs]
  home = ["HTML", "RSS", "JSON"]   # JSON powers the search page

[params]
  [params.intro]
    title = "Hi, I'm Yixi 👋"
    content = "Blog posts and notes. Notes on procedural content generation (PCG) live under the **PCG** tiles below."

[[menu.main]]
